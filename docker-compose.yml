services:
  ash:
    build: .
    container_name: ash-auralis
    ports:
      - "8000:8000"
    volumes:
      - ./music:/app/music
      - ./data:/app/data
    environment:
      - MUSIC_DIR=/app/music
      - DATA_DIR=/app/data
      - DATABASE_URL=sqlite:////app/data/ash.db
    restart: unless-stopped
